<div class="login-card">
  <!-- Centered Brand Graphic Circle (Animated by Theme) -->
  <div class="login-brand-circle">
    <div class="login-brand-graphic"></div>
  </div>

  <div class="login-header">
    <h2>Meu Gerenciador de Aulas e Presenças</h2>
  </div>

  <form (ngSubmit)="onSubmit()">
    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div class="form-group">
      <label for="usernameOrEmail">Usuário ou E-mail</label>
      <input
        id="usernameOrEmail"
        type="text"
        class="form-control"
        placeholder="Digite seu usuário ou e-mail"
        [(ngModel)]="usernameOrEmail"
        name="usernameOrEmail"
        [disabled]="loading"
        required
        autocomplete="username"
      />
    </div>

    <div class="form-group">
      <label for="password">Senha</label>
      <input
        id="password"
        type="password"
        class="form-control"
        placeholder="Digite sua senha"
        [(ngModel)]="password"
        name="password"
        [disabled]="loading"
        required
        autocomplete="current-password"
      />
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="loading || !usernameOrEmail || !password">
      {{ loading ? 'Autenticando...' : 'Entrar' }}
    </button>
  </form>
</div>
