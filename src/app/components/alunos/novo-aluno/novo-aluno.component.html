<div class="modal-backdrop" (click)="fechar()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title">Novo Aluno</h3>
      <button type="button" class="btn-close" (click)="fechar()" title="Fechar">&times;</button>
    </div>

    <form (ngSubmit)="salvar()">
      <div class="modal-body">
        <div *ngIf="errorMessage" class="alert alert-danger">
          {{ errorMessage }}
        </div>

        <div class="form-group">
          <label for="nomeAluno">Nome</label>
          <input
            id="nomeAluno"
            type="text"
            class="form-control"
            placeholder="Nome do aluno"
            [(ngModel)]="nome"
            name="nome"
            required
            autocomplete="off"
          />
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="fechar()" [disabled]="loading">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="loading || !nome.trim()">
          {{ loading ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    </form>
  </div>
</div>
