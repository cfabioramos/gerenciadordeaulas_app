<div class="list-container">
  <div class="list-header">
    <div class="title-with-back">
      <button class="btn-back" (click)="goBack()" title="Voltar">
        ←
      </button>
      <div class="header-text-group">
        <h2 class="list-title">
          <a (click)="goToAulas()" class="title-link" title="Aulas">Aulas</a>
        </h2>

        <nav class="header-breadcrumbs" *ngIf="cicloNome || programaNome">
          <a *ngIf="cicloNome" (click)="goToCiclos()" class="crumb crumb-link" title="Ir para Ciclos de Aulas">{{ cicloNome }}</a>
          <span *ngIf="cicloNome && programaNome" class="crumb-sep">/</span>
          <a *ngIf="programaNome" (click)="goToProgramas()" class="crumb crumb-link" title="Ir para Programas de Aulas">{{ programaNome }}</a>
        </nav>
      </div>
    </div>
    <div class="filters">
      <input type="text" placeholder="Filtrar por nome..." [(ngModel)]="searchTerm" (input)="applyFilter()" />
      <button (click)="toggleSort()">
        Ordenar {{ sortAscending ? 'A-Z' : 'Z-A' }}
      </button>
    </div>
  </div>

  <div class="table-responsive">
    <table class="list-table">
      <thead>
        <tr>
          <th (click)="toggleSort()">Nome</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let aula of filteredAulas" (click)="selectAula(aula)">
          <td>{{ aula.nome }}</td>
        </tr>
        <tr *ngIf="filteredAulas.length === 0">
          <td style="text-align: center;">Nenhuma aula encontrada.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
