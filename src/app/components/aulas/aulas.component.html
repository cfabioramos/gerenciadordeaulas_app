<div class="list-container">
  <div class="list-header">
    <h2 class="list-title">Aulas</h2>
    <div class="filters">
      <input type="text" placeholder="Filtrar por nome..." [(ngModel)]="searchTerm" (input)="applyFilter()" />
      <button (click)="toggleSort()">
        Ordenar {{ sortAscending ? 'A-Z' : 'Z-A' }}
      </button>
    </div>
  </div>

  <table class="list-table">
    <thead>
      <tr>
        <th (click)="toggleSort()">Nome</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let aula of filteredAulas" (click)="selectAula(aula)">
        <td>{{ aula.nome }}</td>
      </tr>
      <tr *ngIf="filteredAulas.length === 0">
        <td style="text-align: center;">Nenhuma aula encontrada.</td>
      </tr>
    </tbody>
  </table>
</div>
