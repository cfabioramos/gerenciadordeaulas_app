<div class="list-container">
  <div class="list-header">
    <div class="title-with-back">
      <button class="btn-back" (click)="goBack()" title="Voltar">
        ←
      </button>
      <div class="header-text-group">
        <h2 class="list-title">
          <a (click)="goToProgramas()" class="title-link" title="Programas de Aulas">Programas de Aulas</a>
        </h2>

        <nav class="header-breadcrumbs" *ngIf="cicloNome">
          <a (click)="goToCiclos()" class="crumb crumb-link" title="Ir para Ciclos de Aulas">{{ cicloNome }}</a>
        </nav>
      </div>
    </div>
    <div class="filters">
      <input type="text" placeholder="Filtrar por nome..." [(ngModel)]="searchTerm" (input)="applyFilter()" />
      <button (click)="toggleSort()">
        Ordenar {{ sortAscending ? 'A-Z' : 'Z-A' }}
      </button>
    </div>
  </div>

  <div class="table-responsive">
    <table class="list-table">
      <thead>
        <tr>
          <th (click)="toggleSort()">Programação</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let programa of filteredProgramas" (click)="selectPrograma(programa)">
          <td>{{ programa.nome }}</td>
        </tr>
        <tr *ngIf="filteredProgramas.length === 0">
          <td style="text-align: center;">Nenhum programa de aulas encontrado.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
