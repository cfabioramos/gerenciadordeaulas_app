<div class="list-container">
  <div class="list-header">
    <div class="title-with-back">
      <button class="btn-back" (click)="goBack()" title="Voltar">
        ←
      </button>
      <div class="header-text-group">
        <h2 class="list-title">
          <a (click)="goToPresencas()" class="title-link" title="Presença">Presença</a>
        </h2>

        <nav class="header-breadcrumbs" *ngIf="cicloNome || programaNome || aulaNome">
          <a *ngIf="cicloNome" (click)="goToCiclos()" class="crumb crumb-link" title="Ir para Ciclos de Aulas">{{ cicloNome }}</a>
          <span *ngIf="cicloNome && (programaNome || aulaNome)" class="crumb-sep">/</span>
          <a *ngIf="programaNome" (click)="goToProgramas()" class="crumb crumb-link" title="Ir para Programas de Aulas">{{ programaNome }}</a>
          <span *ngIf="programaNome && aulaNome" class="crumb-sep">/</span>
          <a *ngIf="aulaNome" (click)="goToAulas()" class="crumb crumb-link" title="Ir para Aulas">{{ aulaNome }}</a>
        </nav>
      </div>
    </div>
    <div class="filters">
      <input type="text" placeholder="Filtrar por nome..." [(ngModel)]="searchTerm" (input)="applyFilter()" />
      <button (click)="toggleSort()">
        Ordenar {{ sortAscending ? 'A-Z' : 'Z-A' }}
      </button>
    </div>
  </div>

  <div class="table-responsive">
    <table class="list-table">
      <thead>
        <tr>
          <th (click)="toggleSort()">Nome</th>
          <th>Presente?</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let matricula of filteredMatriculas">
          <td>{{ matricula.alunoNome }}</td>
          <td>
            <label class="switch">
              <input 
                type="checkbox" 
                [checked]="matricula.presente" 
                [(ngModel)]="matricula.presente" 
                (change)="onTogglePresenca(matricula, $event)">
              <span class="slider round"></span>
            </label>
          </td>
        </tr>
        <tr *ngIf="filteredMatriculas.length === 0">
          <td colspan="2" style="text-align: center;">Nenhuma presença encontrada para esta aula.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
