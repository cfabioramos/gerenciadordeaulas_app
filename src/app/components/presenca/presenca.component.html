<div class="list-container">
  <div class="list-header">
    <h2 class="list-title">Presença</h2>
    <div class="filters">
      <input type="text" placeholder="Filtrar por nome..." [(ngModel)]="searchTerm" (input)="applyFilter()" />
      <button (click)="toggleSort()">
        Ordenar {{ sortAscending ? 'A-Z' : 'Z-A' }}
      </button>
    </div>
  </div>

  <table class="list-table">
    <thead>
      <tr>
        <th (click)="toggleSort()">Nome</th>
        <th>Presente?</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let aluno of filteredAlunos">
        <td>{{ aluno.nome }}</td>
        <td>
          <label class="switch">
            <input type="checkbox" [(ngModel)]="aluno.isPresente" (change)="onTogglePresenca(aluno)">
            <span class="slider round"></span>
          </label>
        </td>
      </tr>
      <tr *ngIf="filteredAlunos.length === 0">
        <td colspan="2" style="text-align: center;">Nenhum aluno encontrado para esta aula.</td>
      </tr>
    </tbody>
  </table>
</div>
