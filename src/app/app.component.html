<div class="app-container" [class.login-layout]="!isLoggedIn()">
  <!-- Theme Background Illustration Watermark -->
  <div class="theme-illustration-bg"></div>

  <!-- Header -->
  <header class="app-header" *ngIf="isLoggedIn()">
    <div class="header-content">
      <h1>Meu Gerenciador de Presenças</h1>
      <div class="user-info">
        <div class="theme-selector-container">
          <label class="theme-label" for="headerThemeSelect">Tema:</label>
          <select id="headerThemeSelect" class="theme-select" [value]="currentTheme" (change)="onThemeChange($event)">
            <option value="nordeste">Nordeste</option>
            <option value="dancacircular">Dança Circular</option>
            <option value="forro">Forró</option>
            <option value="frevo">Frevo</option>
          </select>
        </div>
        <span class="user-name">Olá, {{ getUserNome() }}</span>
        <button class="btn-logout" (click)="logout()">Sair</button>
      </div>
    </div>
  </header>

  <div class="main-wrapper">
    <!-- Menu Sidebar -->
    <aside class="app-sidebar" *ngIf="isLoggedIn()">
      <!-- Cheerful Sidebar Banner -->
      <div class="sidebar-theme-banner">
        <div class="sidebar-theme-graphic"></div>
      </div>

      <nav class="nav-menu">
        <a routerLink="/ciclos" routerLinkActive="active" class="nav-item">
          <span class="icon">📅</span>
          <span class="text">Ciclos de Aulas</span>
        </a>
        <a routerLink="/alunos" routerLinkActive="active" class="nav-item">
          <span class="icon">🎓</span>
          <span class="text">Alunos e Matrículas</span>
        </a>
        <a routerLink="/dashboards" routerLinkActive="active" class="nav-item">
          <span class="icon">📊</span>
          <span class="text">Dashboards</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Footer -->
  <footer class="app-footer" *ngIf="isLoggedIn()">
    <div class="footer-left">
      <a href="https://instagram.com/marcosaffonso" target="_blank" rel="noopener">&#64;marcosaffonso</a>
    </div>
    <div class="footer-center">
      Powered by Ziriguidum
    </div>
    <div class="footer-right">
      <span class="signature"><a href="https://instagram.com/fabinhoforrozeiro" target="_blank" rel="noopener" style="color: inherit; text-decoration: none;">&#64;fabinhoforrozeiro</a></span>
    </div>
  </footer>
</div>
